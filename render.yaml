services:
  - type: web
    name: dso429-live-answer-check
    runtime: python
    # A persistent disk needs a paid plan. Free-tier storage is wiped on
    # every restart, which would lose submissions.
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    disk:
      name: submissions
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: CLOSES_AT
        sync: false
      - key: SUBMISSIONS_DIR
        value: /var/data/submissions
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: REVISION_MODEL
        value: anthropic/claude-sonnet-5.5
      - key: HINT_THRESHOLD
        value: "0.5"
      - key: PASS_THRESHOLD
        value: "0.8"
      - key: MAX_HINTS
        value: "3"
      - key: DEMO_MODE
        value: "false"
