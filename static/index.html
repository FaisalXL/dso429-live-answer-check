<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DSO 429 · Extra credit assignment</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" />
<style>
  /* A printed quiz handout: a warm paper sheet on a desk, black ink, a
     cardinal grader's pen for numbers and marks, and a yellow highlighter
     for text the AI changed. Labels are plain sentence case. */
  :root {
    --desk: #ebe5d8;
    --page: #fffdf7;
    --tint: #f6f0e4;
    --sheet: #ffffff;
    --ink: #1d1b18;
    --ink-2: #565046;
    --ink-3: #8a8377;
    --on-ink: #fffdf7;
    --rule: #e8e1d3;
    --rule-strong: #cfc6b3;
    --accent: #9e1b32;
    --accent-soft: #f8e8ea;
    --hl: #ffe27a;
    --hl-soft: #fff6cf;
    --good: #2f7a47;
    --good-soft: #e7f2ea;
    --warn: #96600f;
    --warn-soft: #fbf0dc;
    --red: #b3261e;
    --red-soft: #fbe9e7;
    --shadow: rgba(70, 50, 20, 0.16);
    --font-display: "Literata", Georgia, "Times New Roman", serif;
    --font-body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --line: 1.75rem;
    --pad: clamp(16px, 6vw, 60px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --desk: #121110; --page: #1b1916; --tint: #24211c; --sheet: #211e1a;
      --ink: #ede7db; --ink-2: #bdb4a5; --ink-3: #8d8577; --on-ink: #1b1916;
      --rule: #302c26; --rule-strong: #4b453b;
      --accent: #ee8e9a; --accent-soft: #3a1e23;
      --hl: rgba(222, 186, 62, 0.42); --hl-soft: #332c17;
      --good: #7cc995; --good-soft: #16301f; --warn: #e3ae5c; --warn-soft: #33270f;
      --red: #f08a80; --red-soft: #3b1d1a; --shadow: rgba(0, 0, 0, 0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --desk: #121110; --page: #1b1916; --tint: #24211c; --sheet: #211e1a;
    --ink: #ede7db; --ink-2: #bdb4a5; --ink-3: #8d8577; --on-ink: #1b1916;
    --rule: #302c26; --rule-strong: #4b453b;
    --accent: #ee8e9a; --accent-soft: #3a1e23;
    --hl: rgba(222, 186, 62, 0.42); --hl-soft: #332c17;
    --good: #7cc995; --good-soft: #16301f; --warn: #e3ae5c; --warn-soft: #33270f;
    --red: #f08a80; --red-soft: #3b1d1a; --shadow: rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--desk);
    color: var(--ink);
    font: 400 16px/1.55 var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; z-index: 30;
    height: env(safe-area-inset-top, 0px); background: var(--desk);
  }
  a { color: inherit; text-decoration-color: var(--rule-strong); text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { transition: none !important; }
  }

  /* ---------- sticky strip: course name and answer bubbles ---------- */
  .strip {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: var(--desk);
    border-bottom: 1px solid var(--rule-strong);
  }
  .strip-inner {
    max-width: 840px; margin: 0 auto;
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  }
  .brand { font: 600 14px/1 var(--font-body); white-space: nowrap; }
  .progress-text { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .conn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); }
  .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
  .conn-dot.on { background: var(--good); }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
  .tab {
    width: 30px; height: 30px; padding: 0;
    display: inline-grid; place-items: center;
    border: 1.5px solid var(--ink-3); border-radius: 50%;
    font: 600 13px/1 var(--font-body); color: var(--ink-2);
    text-decoration: none; background: var(--page);
    font-variant-numeric: tabular-nums;
  }
  .tab.started { border: 2px solid var(--ink); color: var(--ink); }
  .tab.complete { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
  .tab.wide { width: auto; padding: 0 12px; border-radius: 999px; }
  .tab-reset { border-style: dashed; border-color: var(--warn); color: var(--warn); background: transparent; cursor: pointer; }

  /* ---------- the quiz sheet ---------- */
  main {
    max-width: 840px; margin: 28px auto 96px;
    background: var(--page);
    border: 1px solid var(--rule-strong);
    box-shadow: 0 18px 40px -26px var(--shadow);
    padding-block: 44px 64px;
    padding-left: max(var(--pad), env(safe-area-inset-left, 0px));
    padding-right: max(var(--pad), env(safe-area-inset-right, 0px));
    display: grid; gap: 56px;
  }
  @media (max-width: 640px) {
    main { margin: 0 0 64px; border-width: 0 0 1px; box-shadow: none; padding-block: 28px 48px; gap: 44px; }
  }

  /* ---------- cover ---------- */
  .cover { display: grid; gap: 30px; }
  .cover-head {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px;
    padding-bottom: 10px; border-bottom: 3px double var(--ink);
    font-size: 14px; color: var(--ink-2);
  }
  .cover-head strong { color: var(--ink); font-weight: 600; }
  .cover-head .cover-title { margin: 0; font: inherit; letter-spacing: normal; }
  h1 { font: 600 clamp(2.2rem, 6vw, 3rem)/1.05 var(--font-display); letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
  .lede { margin: 20px 0 0; max-width: 60ch; color: var(--ink-2); font: 400 1.1rem/1.6 var(--font-display); }
  .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 36px; }
  .blank { display: flex; align-items: baseline; gap: 10px; }
  .blank label { font-weight: 600; white-space: nowrap; }
  .blank input {
    flex: 1; min-width: 0; font: 400 1.05rem/1.4 var(--font-body); color: var(--ink);
    background: transparent; border: 0; border-bottom: 1.5px solid var(--ink); border-radius: 0; padding: 4px 2px;
  }
  .blank input:focus { outline: none; border-bottom-color: var(--accent); box-shadow: 0 1.5px 0 var(--accent); }
  .blank input::placeholder { color: var(--ink-3); }
  .field-note { margin: 6px 0 0; font-size: 13px; color: var(--ink-3); }
  .instructions h2, .contents-title { font: 600 1rem/1.3 var(--font-body); margin: 0 0 12px; }
  .instructions ol { list-style: none; margin: 0; padding: 0; counter-reset: step; display: grid; gap: 10px; }
  .instructions li { counter-increment: step; display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); max-width: 68ch; }
  .instructions li::before { content: counter(step) "."; font: 600 1rem/1.55 var(--font-display); color: var(--accent); }
  .contents { width: 100%; border-collapse: collapse; font-size: 15px; }
  .contents th { text-align: left; font-size: 13px; font-weight: 600; color: var(--ink-2); padding: 0 12px 8px 0; border-bottom: 1.5px solid var(--ink); }
  .contents td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--rule); vertical-align: baseline; }
  .contents td.n { width: 2rem; font: 600 1.05rem/1 var(--font-display); color: var(--accent); }
  .contents .num { text-align: right; padding-right: 0; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .contents .fb, .contents .pts { text-align: center; width: 5rem; font-variant-numeric: tabular-nums; }
  .contents tbody .fb { color: var(--good); font-weight: 600; }
  .contents td.fmt { color: var(--ink-2); white-space: nowrap; }
  .contents tfoot td { border-bottom: 0; border-top: 1.5px solid var(--ink); font-weight: 600; }
  @media (max-width: 600px) {
    .fields { grid-template-columns: 1fr; }
    .contents .fmt { display: none; }
  }

  /* ---------- shared controls ---------- */
  .label, label.field { display: block; margin-bottom: 8px; font: 600 15px/1.35 var(--font-body); color: var(--ink); }
  textarea {
    display: block; width: 100%; min-height: 9rem; resize: vertical;
    font: 400 1rem/1.6 var(--font-body); color: var(--ink);
    background: var(--sheet); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 12px 14px;
  }
  /* Rules sit under every line of writing and scroll with the text. */
  textarea.ruled {
    min-height: calc(var(--line) * 7);
    line-height: var(--line);
    padding: calc(var(--line) / 2) 16px 0;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--line) - 1px), var(--rule) calc(var(--line) - 1px), var(--rule) var(--line));
    background-position: 0 calc(var(--line) / 2);
    background-attachment: local;
  }
  textarea.short { min-height: 5.5rem; }
  textarea:disabled, input:disabled { opacity: 0.7; }
  textarea::placeholder { color: var(--ink-3); }

  .btn {
    font: 600 14px/1 var(--font-body); padding: 11px 18px; border-radius: 4px; cursor: pointer;
    background: var(--ink); color: var(--on-ink); border: 1px solid var(--ink);
  }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule-strong); }
  .btn.pen { background: var(--accent); border-color: var(--accent); color: var(--on-ink); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.small-btn { font-size: 13px; padding: 8px 12px; color: var(--ink-2); }
  .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .muted { color: var(--ink-2); }
  .small { font-size: 13px; }

  /* ---------- question ---------- */
  .q { display: grid; gap: 24px; padding-top: 44px; border-top: 1px solid var(--rule-strong); scroll-margin-top: 72px; }
  .q-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 16px; align-items: start; }
  .q-points { margin-top: 4px; padding: 3px 10px; border: 1.5px solid var(--ink); border-radius: 999px; font: 600 13px/1.4 var(--font-body); white-space: nowrap; }
  .q-num { font: 600 2.6rem/0.95 var(--font-display); color: var(--accent); font-variant-numeric: lining-nums; }
  .q h2 { font: 600 1.55rem/1.2 var(--font-display); margin: 0; text-wrap: balance; }
  .q-meta { margin-top: 4px; font-size: 14px; color: var(--ink-3); }
  .prompt { font: 400 1.12rem/1.65 var(--font-display); margin: 0; max-width: 65ch; }

  /* ---------- how-close scale ---------- */
  .meter { display: grid; gap: 8px; }
  .meter-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .meter-value { font: 600 1.9rem/1 var(--font-body); font-variant-numeric: tabular-nums; color: var(--ink-3); }
  .meter-value small { font-size: 0.85rem; font-weight: 400; color: var(--ink-3); margin-left: 3px; }
  .meter-track { position: relative; height: 10px; border-radius: 5px; background: var(--rule); }
  .meter-fill {
    position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 5px; background: var(--ink-3);
    transition: width 260ms ease, background-color 260ms ease;
  }
  .meter-marker { position: absolute; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--ink); }
  .meter-scale { position: relative; height: 14px; font: 400 11px/1 var(--font-body); color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .meter-scale span { position: absolute; top: 0; transform: translateX(-50%); }
  .meter-scale span:first-child { transform: none; }
  .meter-scale span:last-child { transform: translateX(-100%); }
  .meter-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: 13px; color: var(--ink-2); }
  .meter-status { color: var(--ink-3); }
  /* Far off reads as pencil grey, not a red mark: this scale guides, it does not grade. */
  .meter[data-tone=low] .meter-fill { background: var(--ink-3); }
  .meter[data-tone=low] .meter-value { color: var(--ink-2); }
  .meter[data-tone=mid] .meter-fill { background: var(--warn); }
  .meter[data-tone=mid] .meter-value { color: var(--warn); }
  .meter[data-tone=high] .meter-fill { background: var(--good); }
  .meter[data-tone=high] .meter-value { color: var(--good); }

  .hints { display: grid; gap: 10px; }
  .hint-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .hint-list li { padding: 10px 14px; border-left: 3px solid var(--hl); background: var(--hl-soft); font-size: 15px; }

  /* ---------- fix-the-AI ---------- */
  .sheet { background: var(--tint); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 20px 22px; }
  .sheet-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; margin-bottom: 12px; }
  .sheet-head .label { font-size: 13px; color: var(--ink-2); }
  .ai-text { font: 400 1.06rem/1.72 var(--font-display); }
  .ai-text mark { background: linear-gradient(transparent 45%, var(--hl) 45%); color: inherit; padding: 0 1px; }
  .notice { padding: 12px 14px; border-radius: 4px; font-size: 15px; border: 1px solid; }
  .notice.ok { background: var(--good-soft); border-color: var(--good); }
  .notice.warn { background: var(--warn-soft); border-color: var(--warn); }
  .notice.err { background: var(--red-soft); border-color: var(--red); }
  .critique { display: grid; gap: 10px; }
  .rounds { margin: 0; padding: 0; list-style: none; display: grid; }
  .rounds li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 14px; padding: 12px 0; border-top: 1px solid var(--rule); font-size: 15px; }
  .rounds .n { font: 600 13px/1.6 var(--font-body); color: var(--accent); grid-row: span 2; }
  .rounds .meta { font-size: 13px; color: var(--ink-2); }

  .feedback { display: grid; gap: 4px; padding: 18px 20px; border: 1px dashed var(--rule-strong); border-radius: 4px; }
  .feedback .credit { color: var(--accent); font-weight: 600; }

  details.key { border: 1px dashed var(--warn); border-radius: 4px; padding: 10px 14px; }
  details.key summary { cursor: pointer; font: 600 13px/1.3 var(--font-body); color: var(--warn); }
  details.key p { margin: 10px 0 0; font-size: 14px; color: var(--ink-2); }
  .dev-line { font: 400 12px/1.4 var(--font-mono); color: var(--ink-3); }

  /* ---------- submit ---------- */
  .submit { display: grid; gap: 22px; padding-top: 44px; border-top: 3px double var(--ink); scroll-margin-top: 72px; }
  .submit h2 { font: 600 1.8rem/1.15 var(--font-display); margin: 0; }
  .checklist { list-style: none; margin: 0; padding: 0; display: grid; }
  .checklist li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--rule); font-size: 15px; }
  .checklist .yes { color: var(--good); white-space: nowrap; }
  .checklist .no { color: var(--warn); white-space: nowrap; }
  .checklist .skip { color: var(--ink-3); white-space: nowrap; }
  .consent { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; padding: 16px 18px; background: var(--tint); border: 1px solid var(--rule-strong); border-radius: 4px; font-size: 15px; }
  .consent input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--ink); }
  .receipt td { padding: 9px 0; border-top: 1px solid var(--rule); font-size: 15px; vertical-align: top; }
  .receipt td:last-child { text-align: right; color: var(--ink-2); padding-left: 16px; font-variant-numeric: tabular-nums; }
  .receipt { width: 100%; border-collapse: collapse; }
</style>
</head>
<body>
<div class="strip">
  <div class="strip-inner">
    <div class="brand" id="brand">DSO 429 · Extra credit assignment</div>
    <span class="conn" title="Connection for live scoring"><span class="conn-dot" id="connDot"></span><span id="connText">Connecting…</span></span>
    <span class="progress-text" id="progressText"></span>
    <nav class="tabs" id="tabs" aria-label="Questions"></nav>
  </div>
</div>
<main id="app"><p class="muted">Loading…</p></main>

<script>
const STORAGE_KEY = 'live-answer-lab-v3';
const JEV_THROTTLE_MS = 500;

let A = null;            // assignment config from the server
let S = null;            // student state, saved to localStorage
let reveal = null;       // demo-mode answer key, fetched on demand
const ui = {};           // question id -> live widgets on screen
const sections = {};     // question id -> its <section>
const scoring = new Set(); // fix-the-AI questions whose first score is pending
let jevWs = null, jevSeq = 0;
const jevShown = {};     // question id -> newest seq displayed
const jevTimers = {}, jevLastSent = {};
let cosineWs = null;

// ---------- helpers ----------
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'text') node.textContent = v;
    else if (k === 'class') node.className = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return node;
}
// replaceChildren() would print an empty slot as the text "null".
function fill(node, ...kids) { node.replaceChildren(...kids.flat().filter((c) => c != null && c !== false)); }
const points = (score) => (score == null ? '—' : String(Math.round(score * 100)));
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }
function loadState() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { return null; } }
async function api(path, body) {
  const res = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch (e) { /* non-JSON error page */ }
  if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
  return data;
}
function splitSentences(text) { return (text || '').split(/(?<=[.!?])\s+/).filter(Boolean); }
const locked = () => !!S.submitted;

// ---------- state ----------
function freshAnswer(q) {
  // `for` ties saved work to the exact question, so an edited question
  // starts fresh instead of loading work done on a different one.
  const forQ = `${q.type}|${q.prompt}|${q.seed_answer || ''}`;
  return q.type === 'live'
    ? { for: forQ, text: '', score: null, hints: [] }
    : { for: forQ, ai_answer: q.seed_answer, previous_answer: null, score: null, fixed: null, fixed_count: null, solved: false, rounds: [], draft: '', notice: null };
}
function freshState() {
  const answers = {}, feedback = {};
  for (const q of A.questions) { answers[q.id] = freshAnswer(q); feedback[q.id] = ''; }
  return { version: 3, sessionId: A.session_id, startedAt: new Date().toISOString(), student: { name: '', email: '' }, answers, feedback, aiFeedback: '', consent: false, submitted: null, resets: {}, restarts: 0 };
}
function reconcileState(saved) {
  if (!saved || saved.version !== 3) return freshState();
  saved.resets = saved.resets || {};
  saved.student = { name: saved.student?.name || '', email: saved.student?.email || '' };
  if (saved.aiFeedback == null) saved.aiFeedback = '';
  for (const q of A.questions) {
    const fresh = freshAnswer(q);
    if (!saved.answers[q.id] || saved.answers[q.id].for !== fresh.for) {
      saved.answers[q.id] = fresh;
      saved.feedback[q.id] = '';
      saved.resets[q.id] = 0;
    }
    if (saved.feedback[q.id] == null) saved.feedback[q.id] = '';
  }
  return saved;
}
function isStarted(q) {
  const a = S.answers[q.id];
  return q.type === 'live' ? a.text.trim().length > 0 : a.rounds.length > 0;
}
const hasFeedback = (q) => S.feedback[q.id].trim().length > 0;

// ---------- websockets ----------
function setConn(on) {
  document.getElementById('connDot').classList.toggle('on', on);
  document.getElementById('connText').textContent = on ? '' : 'Reconnecting…';
}
function connectJev() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  jevWs = new WebSocket(`${proto}://${location.host}/ws/jev`);
  jevWs.onopen = () => {
    setConn(true);
    for (const q of A.questions) {
      const a = S.answers[q.id];
      if (q.type === 'live' && a.text.trim() && a.score == null && !locked()) sendJev(q.id);
    }
  };
  jevWs.onmessage = (ev) => {
    const d = JSON.parse(ev.data);
    if (d.type !== 'jev') return;
    if (d.seq < (jevShown[d.question_id] ?? -1)) return; // stale: a newer score is already shown
    jevShown[d.question_id] = d.seq;
    const w = ui[d.question_id];
    if (d.error) { if (w) w.meter.status(`Scoring down: ${d.error}`); return; }
    S.answers[d.question_id].score = d.score;
    saveState();
    if (w) { w.meter.set(d.score); w.meter.status(''); w.updateHint(); }
    updateCover();
  };
  jevWs.onclose = () => { setConn(false); setTimeout(connectJev, 1000); };
}
function sendJev(qid) {
  jevLastSent[qid] = Date.now();
  if (!jevWs || jevWs.readyState !== WebSocket.OPEN) return;
  jevSeq++;
  jevWs.send(JSON.stringify({ question_id: qid, text: S.answers[qid].text, seq: jevSeq }));
  if (ui[qid]) ui[qid].meter.status('Scoring…');
  if (cosineWs && cosineWs.readyState === WebSocket.OPEN) {
    cosineWs.send(JSON.stringify({ question_id: qid, text: S.answers[qid].text }));
  }
}
function scheduleJev(qid) {
  clearTimeout(jevTimers[qid]);
  const wait = JEV_THROTTLE_MS - (Date.now() - (jevLastSent[qid] || 0));
  if (wait <= 0) sendJev(qid); else jevTimers[qid] = setTimeout(() => sendJev(qid), wait);
}
function connectCosine() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  cosineWs = new WebSocket(`${proto}://${location.host}/ws/cosine`);
  cosineWs.onmessage = (ev) => {
    const d = JSON.parse(ev.data);
    if (ui[d.question_id] && ui[d.question_id].cosine) ui[d.question_id].cosine.textContent = `dev · cosine similarity ${points(d.score)}/100`;
  };
  cosineWs.onclose = () => setTimeout(connectCosine, 2000);
}

// ---------- shared pieces ----------
function makeMeter({ label, markAt, markText }) {
  const value = el('div', { class: 'meter-value' }, el('span', { text: '—' }), el('small', { text: '/100' }));
  const fill = el('div', { class: 'meter-fill' });
  const track = el('div', { class: 'meter-track', role: 'meter', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-label': label },
    fill, markAt == null ? null : el('div', { class: 'meter-marker', style: `left:${markAt * 100}%` }));
  const scale = el('div', { class: 'meter-scale', 'aria-hidden': 'true' },
    [0, 25, 50, 75, 100].map((n) => el('span', { style: `left:${n}%`, text: String(n) })));
  const status = el('span', { class: 'meter-status', text: '' });
  const root = el('div', { class: 'meter', 'data-tone': 'none' },
    el('div', { class: 'meter-top' }, el('span', { class: 'label', style: 'margin:0', text: label }), value),
    track, scale,
    el('div', { class: 'meter-foot' }, el('span', { text: markText }), status));
  return {
    root,
    set(score) {
      const n = score == null ? null : Math.round(score * 100);
      value.firstChild.textContent = n == null ? '—' : String(n);
      fill.style.width = `${n ?? 0}%`;
      track.setAttribute('aria-valuenow', n ?? 0);
      root.dataset.tone = score == null ? 'none' : score < A.hint_threshold ? 'low' : score < A.pass_threshold ? 'mid' : 'high';
    },
    status(text) { status.textContent = text; },
  };
}
function answerKey(q) {
  if (!A.demo_mode) return null;

  const box = el('details', { class: 'key' }, el('summary', { text: 'Answer key · demo only' }), body);
  box.addEventListener('toggle', async () => {

  });
  return box;
}

function liveBody(q) {
  const a = S.answers[q.id];
  const box = el('textarea', { class: 'ruled', id: `answer-${q.id}`, placeholder: 'Your answer…', disabled: locked() });
  box.value = a.text;

  meter.set(a.score);
  meter.status('');
  const cosine = A.dev_cosine ? el('div', { class: 'dev-line', text: 'dev · cosine similarity —' }) : null;

  const hintBtn = el('button', { class: 'btn ghost', type: 'button', text: 'Get a hint' });
  const hintCount = el('span', { class: 'small muted' });
  const hintList = el('ul', { class: 'hint-list' });
  const drawHints = () => hintList.replaceChildren(...a.hints.map((h) => el('li', { text: h })));
  const updateHint = () => {
    const left = A.max_hints - a.hints.length;
    hintCount.textContent = `${plural(left, 'hint')} left`;
    hintBtn.disabled = locked() || !(a.score != null && a.score < A.hint_threshold && left > 0);
  };
  hintBtn.addEventListener('click', async () => {
    hintBtn.disabled = true; hintBtn.textContent = 'Thinking…';
    try {
      const d = await api('/api/hint', { session_id: S.sessionId, question_id: q.id, text: a.text });
      a.hints.push(d.error ? `Hint failed: ${d.detail || d.error}` : d.hint);
    } catch (e) { a.hints.push(`Hint failed: ${e.message}`); }
    saveState(); drawHints(); hintBtn.textContent = 'Get a hint'; updateHint();
  });
  drawHints(); updateHint();

  box.addEventListener('input', () => { a.text = box.value; saveState(); scheduleJev(q.id); renderStrip(); fillSubmit(); });
  ui[q.id] = { meter, updateHint, cosine };

  return el('div', { style: 'display:grid;gap:22px' },

    meter.root, cosine,
    el('div', { class: 'hints' }, el('div', { class: 'row' }, hintBtn, hintCount), hintList),
  );

function fixBody(q) {
  const a = S.answers[q.id];
  // Only notes that change the answer use up a round. Tries are capped
  // separately to bound API cost.
  const used = a.rounds.length;
  const applied = a.rounds.filter((r) => r.changed).length;
  const outOfRounds = applied >= q.max_rounds || used >= q.max_rounds * 3;
  const last = a.rounds[used - 1];

  const text = el('div', { class: 'ai-text' });
  splitSentences(a.ai_answer).forEach((s, i, all) => {
    const isNew = a.previous_answer != null && last && last.changed !== false && !splitSentences(a.previous_answer).includes(s);
    text.appendChild(isNew ? el('mark', { text: s }) : document.createTextNode(s));
    if (i < all.length - 1) text.appendChild(document.createTextNode(' '));
  });
  const sheetLabel = !used ? "AI answer"
    : last.changed === false ? 'AI answer · your last note changed nothing'
    : 'AI answer · changes underlined';
  const sheet = el('div', { class: 'sheet' },
    el('div', { class: 'sheet-head' }, el('span', { class: 'label', style: 'margin:0', text: sheetLabel })),
    text,
  );

  const meter = makeMeter({ label: 'How close the answer is', markAt: null, markText: 'Solved when every claim is right' });
  meter.set(a.progress);
  meter.status('');

  let notice = null;
  if (a.solved) notice = el('div', { class: 'notice ok', text: `Solved in ${plural(applied, 'round')}.` });
  else if (outOfRounds) notice = el('div', { class: 'notice warn', text: 'No rounds left. Start over to try again.' });
  else if (a.notice) notice = el('div', { class: 'notice warn', text: a.notice });

  const draft = el('textarea', { class: 'ruled short', id: `critique-${q.id}`, placeholder: 'Which claim is wrong, and why?', disabled: locked() || a.solved || outOfRounds });
  draft.value = a.draft || '';
  const send = el('button', { class: 'btn pen', type: 'button', text: 'Send to the AI' });
  const errorBox = el('div');
  const updateSend = () => { send.disabled = locked() || a.solved || outOfRounds || !draft.value.trim() || a.score == null; };
  draft.addEventListener('input', () => { a.draft = draft.value; saveState(); updateSend(); });
  send.addEventListener('click', async () => {
    send.disabled = true; draft.disabled = true; send.textContent = 'Revising…';
    meter.status('');
    try {
      const d = await api('/api/correction/round', { question_id: q.id, current_answer: a.ai_answer, feedback: draft.value.trim(), previous_fixed: a.fixed });
      a.rounds.push({
        round: used + 1, feedback: draft.value.trim(), revised_answer: d.revised_answer,
        feedback_specific: d.feedback_specific, changed: d.changed, rejected: d.rejected,
        score: d.score, progress: d.progress, fixed: d.fixed, fixed_count: d.fixed_count, at: new Date().toISOString(),
      });
      if (d.changed) a.previous_answer = a.ai_answer;
      a.ai_answer = d.revised_answer;
      a.notice = !d.feedback_specific ? "No changes made. Say which claim is wrong, and why. This didn't use a round."
        : d.rejected ? "Not applied: the AI changed more than your note explained. Explain each claim you mention. This didn't use a round."
        : null;
      Object.assign(a, { score: d.score, progress: d.progress, fixed: d.fixed, fixed_count: d.fixed_count, solved: d.solved, draft: '' });
      saveState(); fillQuestion(q); renderStrip(); fillSubmit();
    } catch (e) {
      errorBox.replaceChildren(el('div', { class: 'notice err', text: `Round failed: ${e.message}. Try again.` }));
      send.textContent = 'Send to the AI'; draft.disabled = false; updateSend(); meter.status('');
    }
  });
  updateSend();

  if (a.score == null && !scoring.has(q.id)) {
    scoring.add(q.id);
    meter.status('Scoring…');
    api('/api/correction/score', { question_id: q.id, answer: a.ai_answer })
      .then((d) => { Object.assign(a, { score: d.score, progress: d.progress, fixed: d.fixed, fixed_count: d.fixed_count, solved: d.solved }); saveState(); fillQuestion(q); })
      .catch((e) => { meter.status(`Scoring down: ${e.message}`); })
      .finally(() => scoring.delete(q.id));
  }

  const log = a.rounds.length
    ? el('div', {},
        el('div', { class: 'label', text: 'Rounds' }),
        el('ol', { class: 'rounds' }, a.rounds.map((r) => el('li', {},
          el('span', { class: 'n', text: `R${r.round}` }),
          el('span', { text: r.feedback }),
          el('span', { class: 'meta', text: r.feedback_specific === false ? 'No change: not specific'
            : r.rejected ? 'Not applied: AI overreached'
            : `Score ${points(r.progress)}/100` }),
        ))))
    : null;

  return el('div', { style: 'display:grid;gap:22px' },
    sheet,
    meter.root,
    notice,
    el('div', { class: 'critique' },
      el('label', { class: 'field', style: 'margin:0', for: `critique-${q.id}`, text: "What's wrong with the AI's answer?" }),
      draft, errorBox,
      el('div', { class: 'row' }, el('span', { class: 'small muted', text: `Round ${Math.min(applied + 1, q.max_rounds)}/${q.max_rounds}` }), send)),
    log,
  );
}

    el('label', { class: 'consent', for: 'consent' }, consent,
      el('span', {}, el('strong', { text: 'Claude Code may help grade my work. ' }),
        'A TA reviews every grade. Unchecked means graded by hand.')),
    el('div', { class: 'feedback' },
      el('label', { class: 'field', for: 'ai-feedback' }, 'How do you feel about AI grading your work, compared with a human grader? · ', el('span', { class: 'credit', text: plPoints(A.feedback_points) })),
      aiBox),
    errorBox,
    el('div', { class: 'row' },
      el('span', { class: 'small muted', text: A.closed ? 'This assignment is closed.' : named ? 'You can submit with skipped questions or empty feedback boxes.' : S.student.email && !emailOk ? `Use ${A.student_email_hint}.` : 'Add your name and email at the top.' }),
      submit),
  );
}

function receipt() {
  const d = S.submitted;
  const rows = A.questions.map((q, i) => {
    const s = d.server_scores[q.id] || {};
    const detail = s.error ? `Not scored: ${s.error}`
      : s.attempted === false ? 'Skipped'
      : q.type === 'live' ? `${points(s.score)}/100 close`
      : `${points(s.progress)}/100 close${s.solved ? ' · solved' : ''}`;
    return el('tr', {}, el('td', { text: `${i + 1}. ${q.title}` }), el('td', { text: detail }));
  });
  const download = el('button', { class: 'btn ghost', type: 'button', text: 'Download a copy' });
  download.addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(d.record, null, 2)], { type: 'application/json' });
    const link = el('a', { href: URL.createObjectURL(blob), download: `${d.submission_id}.json` });
    document.body.appendChild(link); link.click(); link.remove();
  });
  // The server keeps every submission and grades the latest one, so a
  // student can reopen their work until the close time.
  const edit = A.closed ? null : el('button', { class: 'btn', type: 'button', text: 'Edit and submit again', onclick: () => {
    if (!confirm('Reopen your work? Your answers stay. Submit again before the close time; we grade your latest submission.')) return;
    S.lastSubmissionId = d.submission_id; S.submitted = null;
    saveState(); renderPage();
    document.getElementById('submit').scrollIntoView({ block: 'start' });
  } });
  return [
    el('h2', { id: 'submit-title', text: 'Submitted' }),
    el('p', { class: 'muted', style: 'margin:0' }, 'ID ', el('strong', { style: 'font-family:var(--font-mono)', text: d.submission_id })),
    el('div', { style: 'overflow-x:auto' }, el('table', { class: 'receipt' }, el('tbody', {}, rows))),
    el('p', { class: 'small muted', style: 'margin:0', text: `Feedback points: ${d.feedback_credits * A.feedback_points}/${(d.feedback_total || A.questions.length + 1) * A.feedback_points}. Claude Code grading: ${d.record.consent_claude_code_grading ? 'yes' : 'no'}.${A.closed ? '' : ' You can still change your work and submit again. We grade your latest submission.'}` }),
    el('div', { class: 'row' }, download, edit),
  ];
}

// ---------- boot ----------
async function init() {
  try {
    A = await api('/api/assignment');
  } catch (e) {
    document.getElementById('app').replaceChildren(el('div', { class: 'notice err', text: `Couldn't load: ${e.message}. Reload to try again.` }));
    return;
  }
  S = reconcileState(loadState());
  saveState();
  renderPage();
  connectJev();
  if (A.dev_cosine) connectCosine();
}
init();
</script>
</body>
</html>
